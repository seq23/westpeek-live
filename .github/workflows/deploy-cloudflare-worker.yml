name: Deploy Cloudflare Worker

# Deploys itself on green main: after "Repository validation" succeeds for a push to main, this
# applies the D1 migrations and then deploys THAT commit. Dispatch stays for a manual redeploy.
on:
  workflow_run:
    workflows: ["Repository validation"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare deploy (D1 migrations, then Worker)
    # Only a green validation of a push to main, never a pull request's run or a red one.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POSTDEPLOY_BASE_URL: https://west-peek-live.seq-taylor.workers.dev
      SMOKE_BASE_URL: https://west-peek-live.seq-taylor.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The exact commit validation passed on, not whatever main is by the time this starts.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN" >&2
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID" >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Configure the secrets before dispatching this workflow; a silent skip would report a deploy that never happened." >&2
            exit 1
          fi
          echo "Cloudflare credentials present."

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Worker deploy target
        shell: bash
        run: node scripts/read-wrangler-config.mjs --verify

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate release prepush
        run: timeout --signal=TERM 20m npm run release:prepush:container

      - name: Build Cloudflare worker
        run: timeout --signal=TERM 15m npm run cf:build:recoverable

      - name: Verify worker artifact
        run: |
          set -Eeuo pipefail
          test -f .open-next/worker.js
          test -d .open-next/assets

      # Schema before code, every time: a Worker never reaches production ahead of its tables.
      # Recorded per file in d1_migrations, so an applied file never runs twice.
      - name: Apply D1 migrations
        run: timeout --signal=TERM 5m npx wrangler d1 migrations apply west-peek-live --remote

      - name: Deploy Cloudflare worker
        run: timeout --signal=TERM 5m npm run cf:deploy -- --keep-vars

      - name: Postdeploy smoke
        run: timeout --signal=TERM 5m npm run postdeploy:smoke

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## West Peek Live Cloudflare deployment"
            echo "- Commit: ${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "- Worker: west-peek-live"
            echo "- Conclusion: ${{ job.status }}"
            echo "- Postdeploy target: $POSTDEPLOY_BASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
