name: Supabase migration apply

# The Supabase GitHub integration applies supabase/migrations/ to the production project on every
# push to main and reports the result as its own "Supabase Preview" check run. On 16 Sep 2026 it
# went red twice and nobody saw it, because a check run on a push to main appears on no pull
# request, in no workflow run, and in no notification. Three migrations sat unapplied in production
# for days behind that silence. This workflow is where that red now surfaces.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to read the Supabase verdict for (defaults to this ref)
        required: false
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: supabase-migration-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # On a pull request there is no production apply to read, so this job proves the RULE instead:
  # it replays every terminal state through the same script the push path runs. A guard whose
  # red-versus-green branch is never exercised is a guard nobody can trust.
  replay-the-verdict:
    name: The verdict rule still decides red from green
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Replay every terminal state
        shell: bash
        run: |
          set -Eeuo pipefail
          fail=0
          expect() {
            local want="$1"; shift
            set +e
            node scripts/supabase_apply_verdict.js "$@" >/dev/null 2>&1
            local got=$?
            set -e
            if [ "$got" != "$want" ]; then
              echo "::error::supabase_apply_verdict.js $* exited $got, expected $want"
              fail=1
            else
              echo "ok: $* -> exit $got"
            fi
          }
          expect 0 --verdict success
          expect 0 --verdict neutral
          expect 1 --verdict failure --changed-migrations true
          expect 1 --verdict failure --changed-migrations false
          expect 1 --verdict timed_out --changed-migrations true
          expect 1 --verdict cancelled --changed-migrations true
          expect 1 --verdict action_required --changed-migrations true
          expect 1 --verdict skipped --changed-migrations true
          expect 0 --verdict skipped --changed-migrations false
          expect 1 --verdict something_new --changed-migrations false
          if [ "$fail" -ne 0 ]; then
            echo "::error title=The Supabase verdict rule no longer decides correctly::Fix scripts/supabase_apply_verdict.js before merging; the push path depends on it." >&2
            exit 1
          fi
          echo "All ten terminal states decided correctly."

  # The real thing: what did Supabase actually do with this commit's migrations?
  read-the-verdict:
    name: Supabase applied the migrations
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Did this commit change supabase/migrations?
        id: changed
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          changed=false
          if git rev-parse --verify --quiet "${TARGET_SHA}^" >/dev/null; then
            if git diff --name-only "${TARGET_SHA}^" "${TARGET_SHA}" | grep -q '^supabase/migrations/'; then
              changed=true
            fi
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "supabase/migrations changed in ${TARGET_SHA}: ${changed}"

      - name: Read the Supabase verdict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha || github.sha }}
          CHANGED: ${{ steps.changed.outputs.changed }}
        run: |
          set -Eeuo pipefail
          node scripts/supabase_apply_verdict.js --sha "$TARGET_SHA" --changed-migrations "$CHANGED" | tee /tmp/verdict.txt
          {
            echo "## Supabase migration apply"
            echo ""
            echo '```'
            cat /tmp/verdict.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
